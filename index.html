<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>DizzyOps · AfrodizzyActs</title><style>
:root{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#242424;background:#f7f7f7;--red:#bb1831;--line:#e5e5e5}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ec8a98;outline-offset:2px}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:#171717;color:#f7f7f7;padding:24px 12px}.brand{font-size:24px;font-weight:900;letter-spacing:-.7px;padding:8px 14px 20px}.brand span{color:#ff5470}.side nav{display:grid;gap:3px}.side a{padding:10px 13px;border-radius:9px;font-size:14px}.side a:hover,.side a[aria-current=page]{background:#b91b36;color:white}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 30px;background:#fff;border-bottom:1px solid var(--line)}.top small{color:#666}.wrap{max-width:1450px;margin:auto;padding:28px 30px}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(26px,3vw,38px);line-height:1.1;margin:5px 0 12px}h2{font-size:18px;margin:0 0 14px}.muted{color:#686868}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}.metric{font-size:31px;font-weight:850;margin:8px 0}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #ddd;background:white;padding:10px 15px;border-radius:8px;min-height:43px}.btn.primary{background:var(--red);color:white;border-color:var(--red)}.btn:hover{filter:brightness(.94)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:540px}th,td{padding:12px 9px;border-bottom:1px solid var(--line)}th{font-size:12px;color:#666;text-transform:uppercase}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#f3e9ec;color:#901b30;font-size:12px;font-weight:700}.bar{height:11px;border-radius:10px;background:#eee;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:10px;transition:width .6s}.stack{display:grid;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.notice{background:#fff7e9;border:1px solid #e8d1a8;border-radius:9px;padding:12px;margin:15px 0}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-weight:650;font-size:13px}.field input,.field select,.search{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;background:white;min-width:0}.wide{grid-column:1/-1}.mobile{display:none}.chart{display:flex;align-items:end;gap:13px;height:160px;border-bottom:1px solid #ddd;padding-top:20px}.chart div{flex:1;background:linear-gradient(#db5268,#a91a32);border-radius:6px 6px 0 0;min-height:6px;transition:height .5s}.caption{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-top:7px}.sr{position:absolute;left:-9999px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}@media(max-width:750px){.app{display:block}.side{display:none}.side.open{display:block;position:absolute;z-index:5;width:min(310px,90vw);box-shadow:0 20px 40px #0005}.mobile{display:inline-block}.top,.wrap{padding:17px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:380px){.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style></head><body>
<div class="app"><aside class="side" id="side"><div class="brand">AFRO<span>DIZZY</span>ACTS<small style="display:block;font-size:12px;letter-spacing:.15em;color:#aaa">DIZZYOPS</small></div><nav id="nav" aria-label="Primary navigation"></nav></aside><main class="main"><header class="top"><div><button class="btn mobile" id="menu" aria-label="Toggle navigation" aria-expanded="false">☰ Menu</button><strong>DizzyOps</strong> <small> / <span id="crumb">Dashboard</span></small></div><span class="pill">DEMO MODE</span></header><div class="wrap" id="content"></div></main></div>
<script>
const pages=[['dashboard','Dashboard'],['performers','Performers'],['contractors','Contractors'],['bookings','Bookings & Jobs'],['calendar','Calendar'],['projects','Projects & Events'],['finance','Finance'],['expenses','Expenses & Receipts'],['invoices','Invoices & Payments'],['assets','Documents & Assets'],['reports','Reports & Analytics'],['integrations/sage','Sage Integration'],['integrations/google','Google Workspace'],['settings','Settings & Administration'],['portal','Performer Self-Service']];
const seed={performers:[{name:'Amina Dlamini',role:'Dancer',status:'Available'},{name:'Thabo Mokoena',role:'MC',status:'Booked'},{name:'Lerato Nkosi',role:'Singer',status:'Available'}],contractors:[{name:'StageCraft SA',role:'Production',status:'Active'}],bookings:[{name:'Corporate Gala',role:'Johannesburg',status:'Confirmed'},{name:'Brand Activation',role:'Sandton',status:'Planning'}],projects:[{name:'Summer Showcase',role:'Event',status:'Planning'}],expenses:[{name:'Transport',role:'R 1,250',status:'Pending'}],invoices:[{name:'INV-1001',role:'R 12,500',status:'Outstanding'}],assets:[{name:'Red costume set',role:'Costumes',status:'Available'}]};
let data;try{data=JSON.parse(localStorage.getItem('dizzyops-demo-v1'))||structuredClone(seed)}catch{data=JSON.parse(JSON.stringify(seed))}
function save(){try{localStorage.setItem('dizzyops-demo-v1',JSON.stringify(data))}catch{}}
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=location.pathname.replace(/index\.html$/,'').replace(/\/$/,'');const route=()=>{let p=decodeURIComponent(location.hash.slice(2)||'dashboard');return pages.some(x=>x[0]===p)?p:'dashboard'};
const nav=document.getElementById('nav');nav.innerHTML=pages.map(([p,t])=>'<a href="#/'+p+'" data-route="'+p+'">'+t+'</a>').join('');
const groups={performers:['Performer','Specialism','Availability'],contractors:['Contractor','Service','Status'],bookings:['Booking','Location','Status'],projects:['Project','Category','Status'],expenses:['Expense','Amount','Status'],invoices:['Invoice','Amount','Status'],assets:['Asset','Category','Status']};
function table(key){const rows=data[key]||[];return '<div class="panel"><div class="actions"><input class="search" id="search" placeholder="Search records" aria-label="Search records" style="max-width:330px"><button class="btn primary" id="add">+ Add '+groups[key][0]+'</button></div><div class="tablewrap"><table><thead><tr>'+groups[key].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody id="rows"></tbody></table></div><p class="muted">Records in this prototype are demonstration data saved only in this browser, not shared with staff.</p></div>'}
function drawRows(key,q=''){const rows=(data[key]||[]).filter(x=>Object.values(x).join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('rows').innerHTML=rows.map(x=>'<tr><td><strong>'+escapeHtml(x.name)+'</strong></td><td>'+escapeHtml(x.role)+'</td><td><span class="pill">'+escapeHtml(x.status)+'</span></td></tr>').join('')||'<tr><td colspan="3">No matching records.</td></tr>'}
function form(key){return '<div class="panel"><h2>Add '+groups[key][0]+'</h2><form id="entry" class="form">'+['name','role','status'].map((x,i)=>'<div class="field"><label for="'+x+'">'+groups[key][i]+'</label><input required maxlength="120" id="'+x+'" name="'+x+'"></div>').join('')+'<div class="wide actions"><button class="btn primary" type="submit">Save demo record</button><button class="btn" type="button" id="cancel">Cancel</button></div></form></div>'}
function dashboard(){return '<div class="cards">'+[['Performers',data.performers.length],['Open bookings',data.bookings.length],['Outstanding invoices',data.invoices.length],['Pending expenses',data.expenses.length]].map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="metric">'+b+'</div><span class="pill">Demo records</span></div>').join('')+'</div><div class="grid"><div class="panel"><h2>Operations overview</h2><p class="muted">Illustrative chart — not live business analytics.</p><div class="chart">'+[45,72,53,90,67,84].map(v=>'<div style="height:'+v+'%" title="Illustrative '+v+'"></div>').join('')+'</div><div class="caption"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></div><div class="panel"><h2>Quick actions</h2><div class="stack"><a class="btn" href="#/performers">Manage performers →</a><a class="btn" href="#/bookings">Manage bookings →</a><a class="btn" href="#/invoices">Review invoices →</a><a class="btn" href="#/calendar">Open calendar →</a></div></div></div>'}
function calendar(){let today=new Date();let label=today.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});return '<div class="panel"><h2>'+escapeHtml(label)+'</h2><p class="muted">The shared Google Calendar connection is not configured yet. Booking records can be viewed below.</p>'+data.bookings.map(x=>'<div class="item"><strong>'+escapeHtml(x.name)+'</strong><span class="pill">'+escapeHtml(x.status)+'</span></div>').join('')+'<div class="actions"><a class="btn primary" href="#/bookings">Manage bookings</a></div></div>'}
function report(){const total=data.performers.length,available=data.performers.filter(x=>x.status.toLowerCase()==='available').length;return '<div class="cards"><div class="card"><div class="muted">Performer availability</div><div class="metric">'+available+' / '+total+'</div><div class="bar"><i style="width:'+(total?available/total*100:0)+'%"></i></div></div><div class="card"><div class="muted">Bookings</div><div class="metric">'+data.bookings.length+'</div></div></div><div class="panel"><h2>Insights</h2><p>These calculations use browser demonstration records. Revenue forecasts and AI recommendations require verified operational data and a backend.</p></div>'}
function integrations(p){return '<div class="panel"><h2>'+ (p.includes('sage')?'Sage accounting':'Google Workspace') +'</h2><div class="notice">Not connected. An authorized administrator must configure the secure backend integration before any sync can run.</div><p>'+ (p.includes('sage')?'Planned: invoice mapping, payments, expense reconciliation and sync history.':'Planned: Workspace directory sign-in, Gmail, Calendar, Meet, Drive and authorized guest collaboration.') +'</p></div>'}
function render(){const p=route(),title=pages.find(x=>x[0]===p)[1];document.getElementById('crumb').textContent=title;nav.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.route===p?'page':'false'));document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');let inner='';if(p==='dashboard')inner=dashboard();else if(groups[p])inner=table(p);else if(p==='calendar')inner=calendar();else if(p==='reports'||p==='finance')inner=report();else if(p.startsWith('integrations/'))inner=integrations(p);else if(p==='portal')inner='<div class="panel"><h2>Performer self-service</h2><p>Performers will manage their availability, contracts, assignments and payment status here after secure sign-in is implemented.</p><a class="btn" href="#/performers">View demo performers</a></div>';else inner='<div class="panel"><h2>Administration</h2><p>Google Workspace staff sign-in, application roles, access policies and audit logs will be configured with the secure backend.</p></div>';document.getElementById('content').innerHTML='<div class="eyebrow">AfrodizzyActs / Operations</div><h1>'+escapeHtml(title)+'</h1><p class="muted">Manage your entertainment operations in one workspace.</p>'+inner;
if(groups[p]){drawRows(p);document.getElementById('search').addEventListener('input',e=>drawRows(p,e.target.value));document.getElementById('add').addEventListener('click',()=>{document.getElementById('content').insertAdjacentHTML('beforeend',form(p));document.getElementById('add').disabled=true;document.getElementById('cancel').onclick=()=>render();document.getElementById('entry').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);data[p].push(Object.fromEntries(fd.entries()));save();render()}})}}
window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>{const s=document.getElementById('side');const open=s.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))};render();
</script></body></html>
